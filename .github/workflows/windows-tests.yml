name: Native Windows MDTest tests
on:
  push:
  pull_request:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MDTest and test dependencies
        run: python -m pip install -e ".[workbench]"
      - name: Run unit tests on native Windows
        run: python -m unittest discover -s tests -v
      - name: Verify protected source scope
        run: python testingScripts/check_round3_engine_freeze.py
      - name: Scientific regression
        run: python testingScripts/regression_round2.py
      - name: Scientific regression under Python optimization
        run: python -O testingScripts/regression_round2.py
